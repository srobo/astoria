[project]
name = "astoria"
version = "0.11.1"
description = "Robot Management System for Student Robotics Kit"
authors = [
    { name = "Dan Trickey", email = "dtrickey@studentrobotics.org" },
    { name = "Karina Kwiatek", email = "kkwiatek@studentrobotics.org" },
]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic==2.12.5",
    "click==8.3.1",
    "dbus-next>=0.2.3,<0.3",
    "gmqtt>=0.7.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "uvloop==0.22.1",
    "tomli-w>=1.2.0",
    "ruff==0.14.10",
]

[project.urls]
Homepage = "https://github.com/srobo/astoria"
Repository = "https://github.com/srobo/astoria"
Documentation = "https://srobo.github.io/astoria"

[project.scripts]
astctl = "astoria.astctl:main"
astdiskd = "astoria.astdiskd:main"
astmetad = "astoria.astmetad:main"
astprocd = "astoria.astprocd:main"
astwifid = "astoria.astwifid:main"

[dependency-groups]
dev = [
    "ty>=0.0.6",
    "pyyaml<5.4",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "rope",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx_autodoc_typehints",
    "sphinx-pydantic",
    "sphinx-jsonschema",
    "sphinx-autobuild",
    "sphinx-click",
    "m2r2",
    "types-click",
]

[tool.ty]
src.include = ["stubs"]

[tool.ruff]
lint.select = [
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "COM",
    "DJ",
    "DTZ",
    "E",
    "F",
    "FBT",
    "I",
    "N",
    "S",
    "T10",
    "UP",
    "W",
]
lint.ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "B009",    # Do not call `getattr` with a constant attribute value.
    "B027",    # an empty method in an abstract base class, but has no abstract decorator
    "COM812",  # Missing trailing comma
    "N805",    # First argument of a method should be named `self`
    "S101",    # S101 Use of `assert` detected
]
exclude = [
    "tests/data/execute_code"
]

target-version = "py312"
line-length = 90

[tool.uv]
package = true

[tool.setuptools]
packages = ["astoria"]
