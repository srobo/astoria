[project]
name = "astoria"
version = "0.11.1"
description = "Robot Management System for Student Robotics Kit"
authors = [
    { name = "Dan Trickey", email = "dtrickey@studentrobotics.org" },
    { name = "Karina Kwiatek", email = "kkwiatek@studentrobotics.org" },
]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic==2.12.5",
    "click==8.3.1",
    "dbus-next>=0.2.3,<0.3",
    "gmqtt>=0.7.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "mypy==1.19.1",
]

[project.urls]
Homepage = "https://github.com/srobo/astoria"
Repository = "https://github.com/srobo/astoria"
Documentation = "https://srobo.github.io/astoria"

[project.scripts]
astctl = "astoria.astctl:main"
astdiskd = "astoria.astdiskd:main"
astmetad = "astoria.astmetad:main"
astprocd = "astoria.astprocd:main"
astwifid = "astoria.astwifid:main"

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "pyyaml<5.4",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "rope",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx_autodoc_typehints",
    "sphinx-pydantic",
    "sphinx-jsonschema",
    "sphinx-autobuild",
    "sphinx-click",
    "m2r2",
    "types-click",
]

[tool.black]
line-length = 90
target-version = ['py310']

[tool.mypy]
mypy_path = "stubs"

warn_unused_ignores = true
warn_return_any = true

strict_optional = true
no_implicit_optional = true

disallow_any_unimported = true
disallow_any_explicit = true
disallow_subclassing_any = true
disallow_any_generics = true

disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["dbus_next.*", "gmqtt.*"]
disallow_any_explicit = false

[tool.ruff]
select = [
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "COM",
    "DJ",
    "DTZ",
    "E",
    "F",
    "FBT",
    "I",
    "N",
    "S",
    "T10",
    "UP",
    "W",
]
ignore = [
    "ANN101",  # Missing type annotation for `self` in method
    "ANN102",  # Missing type annotation for `cls` in classmethod
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "B009",    # Do not call `getattr` with a constant attribute value.
    "B027",    # an empty method in an abstract base class, but has no abstract decorator
    "N805",    # First argument of a method should be named `self`
    "S101",    # S101 Use of `assert` detected
]

target-version = "py38"
line-length = 90
